<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shopping cart</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script defer src="assets/js/app.js"></script>
</head>

<body>
    <h1>Add product</h1>
    <form id="cartForm">
        <label>Name of the product:</label>
        <input type="text" id="name" required></input>
        <br> <br>
        <label>Price of the product:</label>
        <input type="number" id="price" required></input>
        <br><br>
        <label>Category:</label>
        <select required id="option">
            <option disabled selected value="0">select category</option>
            <option value="1">Drinks</option>
            <option value="2">Meat</option>
            <option value="3">Dairy</option>
            <option value="4">Snacks</option>
            <option value="5">Basic</option>
        </select>
        <br><br>
        <label>URL of photo:</label>
        <input type="text" id="url"></input>
        <button onclick="addRow(event)">Add product</button>
    </form>

    <br><br>
    <h1>My Cart</h1>
    <table>
        <thead>
            <tr>
                <th>name of the product &nbsp;&nbsp;</th>
                <th>price of the product &nbsp;&nbsp;</th>
                <th>category of the product &nbsp;&nbsp;</th>
                <th>image of the product &nbsp;&nbsp;</th>
                <th>delete button</th>
            </tr>
        </thead>
        <tbody id="table">

        </tbody>
    </table>
</body>

</html>
